[project]
name = "customer-support-system"
version = "0.1.0"
description = "Customer Support System — AI-powered ticket processing pipeline (LangGraph + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.25",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.55.0",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
    "fasttext-wheel>=0.9.2",
    "numpy<2.0",  # fasttext-wheel 0.9.2's C bindings break under NumPy 2.x's stricter copy semantics
    "streamlit>=1.40.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
